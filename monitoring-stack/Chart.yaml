apiVersion: v2
name: monitoring-stack
description: |
  Self-contained observability stack for the k8s-ha cluster: Prometheus scrapes,
  VictoriaMetrics stores long-term, Alloy ships pod logs to Loki, and Grafana
  presents everything through pre-provisioned datasources and dashboards.
  Deliberately CRD-free so that `helm uninstall` leaves nothing behind.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - monitoring
  - observability
  - prometheus
  - victoriametrics
  - loki
  - grafana
home: https://github.com/consectus/prom-grafana-loki-vectoria
maintainers:
  - name: Platform
    email: vikrant.satpute@consectus.com

# NOTE: this chart installs the Prometheus Operator, which brings 10 CRDs
# (monitoring.coreos.com). Helm never deletes CRDs on uninstall, so the
# "remove cleanly in one command" guarantee is preserved by `make uninstall`
# deleting them explicitly rather than by avoiding them. Every other
# dependency below is still CRD-free.
dependencies:
  # Prometheus Operator + Prometheus + Alertmanager + kube-state-metrics +
  # node-exporter (all subcharts). Its bundled Grafana is disabled in
  # values.yaml; the grafana dependency below is the one that runs.
  - name: kube-prometheus-stack
    version: "88.5.3"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  # Long-term metric store; Grafana's default datasource.
  - name: victoria-metrics-single
    version: "0.44.0"
    repository: https://victoriametrics.github.io/helm-charts
    alias: victoriametrics
    condition: victoriametrics.enabled

  # Log store, single-binary + filesystem mode.
  - name: loki
    version: "7.3.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled

  # Log collector DaemonSet (successor to the now-EOL Promtail).
  - name: alloy
    version: "1.11.1"
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled

  # UI.
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
